<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Stardew Valley Greenhouse</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div id="page">
      <img id="main-logo" src="./images/main_logo.png" alt="Stardew Valley logo" />

      <h1>Make Your Own Stardew Garden</h1>

      <div id="left-container" class="container">
        <div class="plant-holder">
          <img class="plant" alt="crocus flower" id="plant1" src="./images/Crocus.png" />
        </div>

        <div class="plant-holder">
          <img class="plant" alt="sunflower" id="plant2" src="./images/sunflower.png" />
        </div>

        <div class="plant-holder">
          <img class="plant" alt="summer spangle flower" id="plant3" src="./images/summer_spangle.png" />
        </div>

        <div class="plant-holder">
          <img class="plant" alt="sweet pea flower" id="plant4" src="./images/sweet_pea.png" />
        </div>
      </div>

      <div id="right-container" class="container">
        <div class="plant-holder">
          <img class="plant" alt="blue jazz flower" id="plant5" src="./images/blue_jazz.png" />
        </div>

        <div class="plant-holder">
          <img class="plant" alt="tulip" id="plant6" src="./images/tulip.png" />
        </div>

        <div class="plant-holder">
          <img class="plant" alt="fairy rose flower" id="plant7" src="./images/fairy_rose.png" />
        </div>

        <div class="plant-holder">
          <img class="plant" alt="poppy flower" id="plant8" src="./images/poppy.png" />
        </div>
      </div>

      <div id="terrarium">
        <img id="greenhouse" src="./images/sdv_greenhouse.png" alt="Stardew Valley greenhouse" />
      </div>
    </div>
  </body>
</html>
